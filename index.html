<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joinery - Quote & Materials Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            primary: '#3b82f6',
                            accent: '#06b6d4',
                            surface: '#ffffff',
                            light: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f1f5f9; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .print-only { display: block !important; }
            .glass-card { box-shadow: none; border: none; padding: 0; }
            main { margin-top: 0 !important; }
        }

        .print-only { display: none; }

        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
        }

        .quick-add-scroll {
            scrollbar-width: thin;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- PRINT HEADER -->
    <div class="print-only p-8 border-b-2 border-slate-900 mb-8">
        <div class="flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold uppercase tracking-tighter">Materials Order</h1>
                <p class="text-slate-500" id="print-date"></p>
            </div>
            <div class="text-right text-xs text-slate-400">
                Joinery Quote Command
            </div>
        </div>
    </div>

    <div class="min-h-screen flex flex-col no-print">
        
        <!-- HEADER -->
        <header class="bg-brand-dark text-white pt-10 pb-20 px-6 rounded-b-[2rem] shadow-2xl relative overflow-hidden z-0">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-end relative z-10 gap-6">
                <div>
                    <h1 class="text-3xl md:text-4xl font-display font-bold text-white mb-1">Quote Command</h1>
                    <div class="flex gap-4 mt-4">
                        <button onclick="switchTab('quotes')" id="tab-btn-quotes" class="pb-2 px-1 font-bold text-sm uppercase tracking-wider tab-active transition-all">Quotes & Profit</button>
                        <button onclick="switchTab('materials')" id="tab-btn-materials" class="pb-2 px-1 font-bold text-sm uppercase tracking-wider text-slate-400 hover:text-white transition-all">Materials List</button>
                    </div>
                </div>
                <div class="text-left md:text-right">
                    <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Total Pipeline</div>
                    <div class="text-3xl font-display font-bold text-brand-accent" id="header-total">£0.00</div>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="relative z-20 max-w-7xl mx-auto px-4 -mt-10 w-full pb-12 flex-grow">

            <!-- TAB 1: QUOTES -->
            <div id="tab-quotes" class="grid lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5 space-y-6">
                    <div class="glass-card p-6 shadow-xl">
                        <form id="quote-form" class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Client Reference</label>
                                <input type="text" id="client-name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-primary" placeholder="e.g. Garden Office Reno" required>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Materials (£)</label>
                                    <input type="number" id="materials-cost" step="0.01" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none" placeholder="0.00">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Labour Qty</label>
                                    <div class="flex gap-1">
                                        <input type="number" id="labour-units" step="0.5" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none" placeholder="Qty">
                                        <select id="labour-type" class="bg-slate-50 border border-slate-200 rounded-xl text-[10px] font-bold">
                                            <option value="days">Days</option>
                                            <option value="hrs">Hrs</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Rate (£)</label>
                                    <input type="number" id="labour-rate" value="250" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Margin (%)</label>
                                    <input type="number" id="profit-margin" value="20" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
                                </div>
                            </div>
                            <div class="pt-2 border-t border-slate-100">
                                <label class="block text-[10px] font-bold text-brand-primary uppercase tracking-widest mb-1">Manual Total Override (Ex VAT)</label>
                                <input type="number" id="manual-total" class="w-full px-4 py-3 bg-blue-50 border border-blue-100 rounded-xl focus:outline-none font-bold" placeholder="Optional round number">
                            </div>
                            <button type="submit" class="w-full bg-brand-primary text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-600 transition-all flex items-center justify-center gap-2">
                                <i data-lucide="plus" class="w-5 h-5"></i> Add to Pipeline
                            </button>
                        </form>
                    </div>
                </div>

                <div class="lg:col-span-7 space-y-6">
                    <div class="glass-card p-6 overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-[10px] uppercase text-slate-400 font-bold border-b border-slate-100">
                                    <th class="pb-4 text-left">Job</th>
                                    <th class="pb-4 text-right">Costs</th>
                                    <th class="pb-4 text-right">Total (Inc VAT)</th>
                                    <th class="pb-4"></th>
                                </tr>
                            </thead>
                            <tbody id="quote-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TAB 2: MATERIALS LIST -->
            <div id="tab-materials" class="hidden grid lg:grid-cols-12 gap-8">
                <!-- Add Materials -->
                <div class="lg:col-span-5 space-y-6">
                    <div class="glass-card p-6 shadow-xl">
                        <h2 class="font-display font-bold text-xl mb-4 flex items-center gap-2">
                            <i data-lucide="shopping-cart" class="text-brand-accent"></i> Shop List
                        </h2>
                        
                        <div class="space-y-4">
                            <div class="flex gap-2">
                                <input type="number" id="mat-qty" class="w-20 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none" placeholder="Qty">
                                <input type="text" id="mat-desc" class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none" placeholder="Item description...">
                                <button onclick="addMaterial()" class="bg-brand-dark text-white p-3 rounded-xl hover:bg-slate-800 transition-all">
                                    <i data-lucide="plus" class="w-6 h-6"></i>
                                </button>
                            </div>

                            <div class="space-y-6 mt-6 max-h-[400px] overflow-y-auto pr-2 quick-add-scroll">
                                <div>
                                    <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 border-b border-slate-100 pb-1">Timber & Sheets</span>
                                    <div class="flex flex-wrap gap-2">
                                        <button onclick="quickAdd('4x2 Treated')" class="px-2 py-1.5 bg-slate-100 hover:bg-blue-100 rounded-lg text-xs transition-colors">4x2 Treated</button>
                                        <button onclick="quickAdd('6x2 Treated')" class="px-2 py-1.5 bg-slate-100 hover:bg-blue-100 rounded-lg text-xs transition-colors">6x2 Treated</button>
                                        <button onclick="quickAdd('18mm OSB')" class="px-2 py-1.5 bg-slate-100 hover:bg-blue-100 rounded-lg text-xs transition-colors">18mm OSB</button>
                                        <button onclick="quickAdd('9mm OSB')" class="px-2 py-1.5 bg-slate-100 hover:bg-blue-100 rounded-lg text-xs transition-colors">9mm OSB</button>
                                        <button onclick="quickAdd('12.5mm P/B')" class="px-2 py-1.5 bg-slate-100 hover:bg-blue-100 rounded-lg text-xs transition-colors">Plasterboard</button>
                                        <button onclick="quickAdd('Loglap')" class="px-2 py-1.5 bg-slate-100 hover:bg-blue-100 rounded-lg text-xs transition-colors">Loglap</button>
                                    </div>
                                </div>

                                <div>
                                    <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 border-b border-slate-100 pb-1">Fixings</span>
                                    <div class="flex flex-wrap gap-2">
                                        <button onclick="quickAdd('90mm Nails')" class="px-2 py-1.5 bg-amber-50 text-amber-700 hover:bg-amber-100 rounded-lg text-xs transition-colors font-medium">90mm Nails</button>
                                        <button onclick="quickAdd('50mm Nails')" class="px-2 py-1.5 bg-amber-50 text-amber-700 hover:bg-amber-100 rounded-lg text-xs transition-colors font-medium">50mm Nails</button>
                                        <button onclick="quickAdd('80mm Screws')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs transition-colors">80mm Screws</button>
                                        <button onclick="quickAdd('50mm Screws')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs transition-colors">50mm Screws</button>
                                        <button onclick="quickAdd('25mm Drywall')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs transition-colors">Drywall Screws</button>
                                    </div>
                                </div>

                                <div>
                                    <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 border-b border-slate-100 pb-1">Ground & Prep</span>
                                    <div class="flex flex-wrap gap-2">
                                        <button onclick="quickAdd('Postcrete')" class="px-2 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-xs transition-colors font-medium">Postcrete</button>
                                        <button onclick="quickAdd('DPM Roll')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs transition-colors">DPM</button>
                                        <button onclick="quickAdd('House Wrap')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs transition-colors">House Wrap</button>
                                        <button onclick="quickAdd('Insulation')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs transition-colors">Insulation</button>
                                        <button onclick="quickAdd('Barge Board')" class="px-2 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs transition-colors">Barge Board</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- The List -->
                <div class="lg:col-span-7 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-600">Active Order</h3>
                        <button onclick="window.print()" class="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-xl text-sm font-bold hover:bg-slate-50 transition-all text-brand-primary">
                            <i data-lucide="file-text" class="w-4 h-4"></i> Get PDF / Print
                        </button>
                    </div>
                    <div class="glass-card p-6 min-h-[400px]">
                        <ul id="materials-display-list" class="space-y-3"></ul>
                        <div id="material-empty" class="flex flex-col items-center justify-center py-20 opacity-30">
                            <i data-lucide="package" class="w-12 h-12 mb-2"></i>
                            <p class="text-xs font-bold uppercase tracking-widest">List is Empty</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="no-print py-8 px-6 mt-auto text-center border-t border-slate-200 bg-white/50">
            <p class="text-xs text-slate-400 font-medium tracking-wide">
                Built by <span class="text-brand-dark">Nicola Berry</span> | 
                <a href="https://empowerdigitalsolutions.co.uk" target="_blank" class="text-brand-primary hover:underline transition-all">
                    Empower Digital Solutions
                </a>
            </p>
        </footer>
    </div>

    <!-- PRINT VIEW -->
    <div class="print-only px-8">
        <table class="w-full border-collapse">
            <thead>
                <tr class="border-b-2 border-slate-300">
                    <th class="py-4 text-left w-12 text-slate-300 italic font-normal">TICK</th>
                    <th class="py-4 text-left w-24">QTY</th>
                    <th class="py-4 text-left font-bold uppercase tracking-widest">DESCRIPTION</th>
                </tr>
            </thead>
            <tbody id="print-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
        <div class="mt-20 pt-8 border-t border-slate-200 text-[10px] text-slate-400 flex justify-between uppercase font-bold tracking-widest">
            <span>Generated via Quote Command</span>
            <span id="print-timestamp"></span>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const now = new Date();
        document.getElementById('print-date').innerText = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('print-timestamp').innerText = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

        let quotes = [];
        let materials = [];

        function switchTab(tab) {
            document.getElementById('tab-quotes').classList.toggle('hidden', tab !== 'quotes');
            document.getElementById('tab-materials').classList.toggle('hidden', tab !== 'materials');
            document.getElementById('tab-btn-quotes').classList.toggle('tab-active', tab === 'quotes');
            document.getElementById('tab-btn-quotes').classList.toggle('text-slate-400', tab !== 'quotes');
            document.getElementById('tab-btn-materials').classList.toggle('tab-active', tab === 'materials');
            document.getElementById('tab-btn-materials').classList.toggle('text-slate-400', tab !== 'materials');
        }

        const formatGBP = (val) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' }).format(val);

        document.getElementById('quote-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const client = document.getElementById('client-name').value;
            const matCost = parseFloat(document.getElementById('materials-cost').value) || 0;
            const units = parseFloat(document.getElementById('labour-units').value) || 0;
            const rate = parseFloat(document.getElementById('labour-rate').value) || 0;
            const margin = parseFloat(document.getElementById('profit-margin').value) || 0;
            const manual = parseFloat(document.getElementById('manual-total').value);

            let netTotal;
            if (!isNaN(manual) && manual > 0) {
                netTotal = manual;
            } else {
                const sub = matCost + (units * rate);
                netTotal = sub + (sub * (margin / 100));
            }

            quotes.unshift({ id: Date.now(), client, grandTotal: netTotal * 1.2, matCost, labour: units * rate });
            updateQuoteUI();
            e.target.reset();
            document.getElementById('labour-rate').value = 250;
            document.getElementById('profit-margin').value = 20;
        });

        function updateQuoteUI() {
            const tbody = document.getElementById('quote-table-body');
            tbody.innerHTML = quotes.map(q => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="py-4 font-bold text-slate-700">${q.client}</td>
                    <td class="py-4 text-right text-slate-400 font-mono text-xs">£${(q.matCost + q.labour).toFixed(2)}</td>
                    <td class="py-4 text-right font-display font-bold text-brand-dark">${formatGBP(q.grandTotal)}</td>
                    <td class="py-4 text-right">
                        <button onclick="deleteQuote(${q.id})" class="text-slate-200 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>
            `).join('');
            const total = quotes.reduce((s, q) => s + q.grandTotal, 0);
            document.getElementById('header-total').innerText = formatGBP(total);
            lucide.createIcons();
        }

        function deleteQuote(id) {
            quotes = quotes.filter(q => q.id !== id);
            updateQuoteUI();
        }

        function addMaterial() {
            const qty = document.getElementById('mat-qty').value;
            const desc = document.getElementById('mat-desc').value;
            if (!desc) return;
            materials.push({ id: Date.now(), qty: qty || '-', desc });
            document.getElementById('mat-qty').value = '';
            document.getElementById('mat-desc').value = '';
            updateMaterialsUI();
        }

        function quickAdd(item) {
            document.getElementById('mat-desc').value = item;
            document.getElementById('mat-qty').focus();
        }

        function removeMaterial(id) {
            materials = materials.filter(m => m.id !== id);
            updateMaterialsUI();
        }

        function updateMaterialsUI() {
            const list = document.getElementById('materials-display-list');
            const empty = document.getElementById('material-empty');
            
            if(materials.length > 0) {
                empty.classList.add('hidden');
            } else {
                empty.classList.remove('hidden');
            }

            list.innerHTML = materials.map(m => `
                <li class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-100 group shadow-sm">
                    <div class="flex items-center gap-4">
                        <span class="w-10 h-10 flex items-center justify-center bg-slate-50 border border-slate-100 rounded-lg font-bold text-xs text-brand-primary">${m.qty}</span>
                        <span class="font-bold text-slate-700 uppercase tracking-tight text-sm">${m.desc}</span>
                    </div>
                    <button onclick="removeMaterial(${m.id})" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition-all p-2">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </li>
            `).join('');

            const printTable = document.getElementById('print-table-body');
            printTable.innerHTML = materials.map(m => `
                <tr>
                    <td class="py-4 border-b border-slate-100 text-2xl font-light text-slate-200">▢</td>
                    <td class="py-4 font-bold border-b border-slate-100 text-lg">${m.qty}</td>
                    <td class="py-4 border-b border-slate-100 uppercase font-bold tracking-tight text-lg">${m.desc}</td>
                </tr>
            `).join('');
            lucide.createIcons();
        }
    </script>
</body>
</html>
